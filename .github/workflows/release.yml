name: Release Lithotheque Hub Multi-Arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Hardened Multi-Arch Packages & Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Façade Repository
        uses: actions/checkout@v4

      # Clone éphémère du code source privé depuis GitHub
      - name: Fetch Private Source Code from Private GitHub Repo
        uses: actions/checkout@v4
        with:
          repository: 'GeoStratum/lithotheque-server-dev'
          ref: 'main'
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: '.core_source'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Hardening Tools & MSI Packager
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl dpkg-dev msitools

      - name: Set Release Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
          echo "build_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # 1. Linux x86_64 (.deb) & Docker binary
      - name: Build Linux AMD64 Package
        run: |
          mkdir -p .core_source/packaging/debian/usr/local/bin
          mkdir -p .core_source/packaging/docker
          cd .core_source
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -buildid= -X main.Version=${{ steps.vars.outputs.version }} -X main.BuildDate=${{ steps.vars.outputs.build_date }}" -o packaging/debian/usr/local/bin/litho-hub ./cmd/litho-hub
          upx --best packaging/debian/usr/local/bin/litho-hub
          cp packaging/debian/usr/local/bin/litho-hub packaging/docker/litho-hub-amd64
          chmod 755 packaging/debian/DEBIAN/postinst packaging/debian/DEBIAN/prerm packaging/debian/usr/local/bin/litho-hub
          dpkg-deb --build packaging/debian ../litho-hub_${{ steps.vars.outputs.version }}_amd64.deb
          cd ..

      # 2. Linux ARM64 (.deb - Raspberry Pi 5, AWS Graviton) & Docker binary
      - name: Build Linux ARM64 Package
        run: |
          mkdir -p .core_source/packaging/debian-arm64/usr/local/bin
          cd .core_source
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -buildid= -X main.Version=${{ steps.vars.outputs.version }} -X main.BuildDate=${{ steps.vars.outputs.build_date }}" -o packaging/debian-arm64/usr/local/bin/litho-hub ./cmd/litho-hub
          upx --best packaging/debian-arm64/usr/local/bin/litho-hub
          cp packaging/debian-arm64/usr/local/bin/litho-hub packaging/docker/litho-hub-arm64
          chmod 755 packaging/debian-arm64/DEBIAN/postinst packaging/debian-arm64/DEBIAN/prerm packaging/debian-arm64/usr/local/bin/litho-hub
          dpkg-deb --build packaging/debian-arm64 ../litho-hub_${{ steps.vars.outputs.version }}_arm64.deb
          cd ..

      # 3. Build & Push Multi-Arch Docker Image (GHCR)
      - name: Build and Push Docker Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .core_source
          file: .core_source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/geostratum/lithotheque-server:${{ steps.vars.outputs.version }}
            ghcr.io/geostratum/lithotheque-server:latest

      # 4. Windows x64 (.msi)
      - name: Build Windows x64 MSI Installer
        run: |
          cd .core_source
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -buildid= -X main.Version=${{ steps.vars.outputs.version }} -X main.BuildDate=${{ steps.vars.outputs.build_date }}" -o ../packaging/windows/wix/litho-hub.exe ./cmd/litho-hub
          upx --best ../packaging/windows/wix/litho-hub.exe
          cd ../packaging/windows/wix
          wixl -v Product_x64.wxs -o ../../../litho-hub_${{ steps.vars.outputs.version }}_windows_x64.msi
          cd ../../..

      # 5. Windows ARM64 (.msi - Windows on ARM)
      - name: Build Windows ARM64 MSI Installer
        run: |
          cd .core_source
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -buildid= -X main.Version=${{ steps.vars.outputs.version }} -X main.BuildDate=${{ steps.vars.outputs.build_date }}" -o ../packaging/windows/wix/litho-hub.exe ./cmd/litho-hub
          cd ../packaging/windows/wix
          wixl -v Product_arm64.wxs -o ../../../litho-hub_${{ steps.vars.outputs.version }}_windows_arm64.msi
          cd ../../..

      # Nettoyage des sources avant publication
      - name: Clean Source Code
        run: rm -rf .core_source packaging/windows/wix/litho-hub.exe

      # Publication de la Release avec description en anglais et assets téléchargeables
      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: "Lithotheque Server ${{ steps.vars.outputs.version }}"
          body: |
            ## 🚀 Lithotheque Server - Release ${{ steps.vars.outputs.version }}

            Welcome to the official production release of **Lithotheque Server** (`lithotheque-server`).
            This release provides self-hosted offline synchronization, high-performance structural geology calculations, and automated master GeoPackage GIS exports for the Lithotheque ecosystem.

            ---

            ### 📦 Download Packages

            | Platform | Architecture | Target Devices / Systems | Download Link |
            | :--- | :--- | :--- | :--- |
            | **Linux Debian / Ubuntu** | `x86_64` (AMD64) | Enterprise servers, Cloud VMs, Workstations | `litho-hub_${{ steps.vars.outputs.version }}_amd64.deb` |
            | **Linux ARM64** | `aarch64` (ARM64) | Raspberry Pi 4/5, AWS Graviton, Ampere Altra | `litho-hub_${{ steps.vars.outputs.version }}_arm64.deb` |
            | **Windows Server & Desktop** | `x86_64` (x64) | Windows 10/11, Windows Server 2019/2022/2025 | `litho-hub_${{ steps.vars.outputs.version }}_windows_x64.msi` |
            | **Windows on ARM** | `ARM64` | Windows on ARM | `litho-hub_${{ steps.vars.outputs.version }}_windows_arm64.msi` |
            | **Docker Multi-Arch** | `AMD64 & ARM64` | Docker, Kubernetes, Portainer, TrueNAS | `ghcr.io/geostratum/lithotheque-server:${{ steps.vars.outputs.version }}` |

            ---

            ### 🐳 Quick Start with Docker & Docker Compose
            ```bash
            # Pull and run directly from GitHub Container Registry
            docker run -d --name lithotheque-server \
              -p 8080:8080/tcp \
              -p 51820:51820/udp \
              -v /path/to/license.key:/etc/litho-hub/license.key:ro \
              -v litho_data:/var/lib/litho-hub/data \
              ghcr.io/geostratum/lithotheque-server:latest
            ```

            ---

            ### 🛡️ Security & Integrity
            - **Hardened Execution**: Stripped symbol tables (`-ldflags="-s -w -buildid="`) and UPX compression.
            - **Cryptographic Device Binding**: P-256 ECDSA hardware sealing (Android Keystore & Apple Secure Enclave).
            - **Asynchronous Enrollment**: Long-lived single-use QR codes (up to 7-30 days) for flexible off-grid onboarding.
            - **Anti-Zip Slip & Bomb Protection**: Bounded decompression (max 500 MB, 5000 files) and safe path containment.

            ---

            ### 📖 Quick Start
            1. **Linux**: `sudo dpkg -i litho-hub_${{ steps.vars.outputs.version }}_amd64.deb` (Managed as systemd service).
            2. **Windows**: Run `msiexec /i litho-hub_${{ steps.vars.outputs.version }}_windows_x64.msi /quiet` or double-click to install the service.
            3. Deposit your valid `license.key` in `/etc/litho-hub/` or `C:\ProgramData\Lithotheque Server\`.
            4. Access the local web dashboard at `http://127.0.0.1:8080`.
          draft: false
          prerelease: false
          files: |
            litho-hub_*_amd64.deb
            litho-hub_*_arm64.deb
            litho-hub_*_windows_x64.msi
            litho-hub_*_windows_arm64.msi
            docker-compose.yml
